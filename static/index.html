<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexa+ Talk Sous</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-6">

    <!-- Echo Show Header -->
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
        <div class="flex items-center space-x-3">
            <div class="w-4 h-4 bg-cyan-400 rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wide">Alexa+ Kitchen Display</h1>
        </div>
        <div class="flex items-center space-x-4">
            <button id="new-session-btn" class="text-slate-500 hover:text-slate-300 text-xs underline">New session</button>
            <span class="text-slate-400 text-sm" id="clock">12:00 PM</span>
        </div>
    </header>

    <!-- Main Screen Display -->
    <main class="my-auto max-w-3xl mx-auto w-full text-center space-y-6">
        <div id="timer-alert" class="hidden bg-amber-500/15 border border-amber-400/60 text-amber-200 rounded-xl px-4 py-3 text-lg" role="alert"></div>

        <div id="status" class="text-cyan-400 text-sm uppercase tracking-widest font-semibold">Ready</div>

        <div class="bg-slate-800/80 rounded-2xl p-8 border border-slate-700 shadow-2xl backdrop-blur">
            <p id="chef-response" class="text-2xl font-light leading-relaxed text-slate-100">
                "Press the microphone, or type below, and ask me what we can cook today!"
            </p>
        </div>

        <!-- Cooking progress -->
        <div id="step-card" class="hidden text-left bg-slate-800/60 rounded-xl p-4 border border-slate-700">
            <div class="flex justify-between text-xs text-slate-400">
                <span id="recipe-title" class="font-semibold text-slate-200"></span>
                <span id="step-count"></span>
            </div>
            <p id="step-text" class="mt-2 text-slate-100"></p>
        </div>

        <!-- Timers -->
        <div id="timers" class="flex flex-wrap justify-center gap-3"></div>

        <div id="tool-badge" class="hidden">
            <span class="inline-block bg-slate-800 text-cyan-300 text-xs px-3 py-1 rounded-full border border-cyan-500/30">
                ⚡ MCP tool: <span id="tool-name"></span>
            </span>
        </div>
    </main>

    <!-- Voice + text controls -->
    <footer class="flex flex-col items-center gap-4 pb-4">
        <button id="mic-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 p-6 rounded-full shadow-lg transition-all transform active:scale-95 disabled:opacity-50">
            🎙️ <span id="mic-label" class="font-bold ml-2">Tap to Speak</span>
        </button>
        <form id="text-form" class="flex w-full max-w-xl gap-2">
            <input id="text-input" type="text" maxlength="500" autocomplete="off" placeholder="Or type here, e.g. “I have chicken, rice and lemon”"
                   class="flex-1 bg-slate-800 border border-slate-600 rounded-full px-5 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400">
            <button id="send-btn" type="submit" class="bg-slate-700 hover:bg-slate-600 text-cyan-300 px-5 rounded-full disabled:opacity-50">Send</button>
        </form>
    </footer>

    <!-- Sign-in (shown when the server says the browser is not signed in) -->
    <div id="login-overlay" class="hidden fixed inset-0 z-50 bg-slate-950/95" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <div class="h-full flex items-center justify-center p-6">
            <form id="login-form" class="w-full max-w-sm bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl space-y-4 text-center">
                <h2 id="login-title" class="text-xl font-semibold">Enter access code</h2>
                <input id="login-code" type="password" autocomplete="current-password" maxlength="128" placeholder="Access code"
                       class="w-full bg-slate-900 border border-slate-600 rounded-full px-5 py-3 text-center text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400">
                <p id="login-error" class="text-amber-300 text-sm min-h-[1.25rem]"></p>
                <button id="login-submit" type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-full disabled:opacity-50">Unlock kitchen</button>
            </form>
        </div>
    </div>

    <script src="/static/app.js" defer></script>
</body>
</html>
